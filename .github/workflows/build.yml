name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift build -c release
      - uses: actions/upload-artifact@v4
        with:
          name: big-banner
          path: .build/release/big-banner
